name: deploy

on:
  push:
    branches: [ main ]
    paths:
      - index.html
      - login.html
      - .github/workflows/deploy.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 上传前端到 ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT }}
          source: |
            index.html
            login.html
          target: /srv/manga
          overwrite: true

      - name: 校验
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: ${{ secrets.ECS_PORT }}
          script: |
            md5sum /srv/manga/index.html /srv/manga/login.html
            # 已启用登录门：无 Cookie 时 index.html 必须 302 跳登录页，否则门失效要失败
            code=$(curl -sk -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' https://127.0.0.1:6883/index.html)
            echo "index.html http=$code"
            [ "$code" = "302" ] || { echo "登录门失效: http=$code"; exit 1; }