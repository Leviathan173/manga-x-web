<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录</title>
<style>
:root{--bg:#111;--fg:#e6e6e6;--mut:#888;--acc:#4a9eff;--card:#1c1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.box{width:100%;max-width:340px;padding:28px 24px;background:var(--card);border:1px solid #2a2a2a;border-radius:12px}
h1{margin:0 0 4px;font-size:20px}
p.sub{margin:0 0 20px;color:var(--mut);font-size:13px}
input{width:100%;padding:11px 12px;background:#111;border:1px solid #333;border-radius:8px;color:var(--fg);font-size:15px}
input:focus{outline:none;border-color:var(--acc)}
button{width:100%;margin-top:14px;padding:11px;background:var(--acc);border:0;border-radius:8px;color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{margin-top:12px;color:#f66;font-size:13px;min-height:18px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>登录</h1>
  <p class="sub">请输入访问密码</p>
  <input type="password" id="pw" placeholder="密码" autofocus>
  <button type="submit" id="go">进入</button>
  <div class="err" id="err"></div>
</form>
<script>
const f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), err = document.getElementById('err');
f.onsubmit = async e => {
  e.preventDefault();
  if (!pw.value) return;
  go.disabled = true; err.textContent = '';
  try{
    const r = await fetch('/__login', {method:'POST', headers:{'X-Password': pw.value}});
    if (r.status === 204){ location.replace('/'); return; }
    if (r.status === 429){ err.textContent = '尝试过于频繁，请稍后再试'; }
    else { err.textContent = '密码错误'; }
  }catch(_){ err.textContent = '网络错误，请重试'; }
  go.disabled = false; pw.select();
};
</script>
</body>
</html>
