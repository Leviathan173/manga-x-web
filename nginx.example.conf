# 示例 nginx 配置：托管本前端，并提供前端所需的 JSON 目录接口。
# 放到 /etc/nginx/sites-available/manga 并软链到 sites-enabled/manga：
#   sudo ln -s /etc/nginx/sites-available/manga /etc/nginx/sites-enabled/manga
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # 站点根目录：index.html 放在这里
    root /srv/manga;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # 如需 CSP：本前端用的是内联 <script>/<style>，script-src/style-src 必须带 'unsafe-inline'。

    # 入口不缓存，方便更新前端
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 漫画目录接口。前端请求 /books/<系列>/、/books/<系列>/<章节>/ 并解析 JSON。
    # autoindex_format json 是本项目能列出内容的前提，缺失则页面只有外壳。
    location /books/ {
        autoindex on;
        autoindex_format json;
        limit_except GET HEAD { deny all; }
        # 图片长缓存，返回读者走本地缓存省带宽；目录 JSON 不匹配此规则
        location ~* \.(jpe?g|png|webp|gif|avif)$ {
            expires 30d;
        }
    }

    location / { }
}

# 生产环境建议加 TLS（自备证书或 certbot）：
#   listen 443 ssl;
#   ssl_certificate     /path/fullchain.pem;
#   ssl_certificate_key /path/privkey.pem;
# 需要的访问控制、限速等按自身情况另加。