# 示例 nginx 配置：托管本前端，提供前端所需的 JSON 目录接口，并启用登录门。
# 放到 /etc/nginx/sites-available/manga 并软链到 sites-enabled/manga：
#   sudo ln -s /etc/nginx/sites-available/manga /etc/nginx/sites-enabled/manga
#   sudo nginx -t && sudo systemctl reload nginx
#
# 令牌/密码先本地生成，再替换下面两处占位符（真值只留在这份服务器配置里）：
#   openssl rand -hex 16     # → 替换 <TOKEN>
#   <自定访客密码>           # → 替换 <PASSWORD>

# --- http 上下文（本文件被 include 进 http{}）---

# 登录接口防爆破：每 IP 5 次/分钟（突发 5）
limit_req_zone $binary_remote_addr zone=manga_login:10m rate=5r/m;

# CLI/脚本爬虫 UA（含空 UA）→ 1：仅写进日志，不拦截（UA 可伪造，403 只带来误杀与虚假信心）
map $http_user_agent $manga_bad_ua {
    default 0;
    ""      1;
    ~*(curl|wget|python|python-requests|scrapy|httrack|aria2|axel|libwww|lwp|httpie|go-http-client|okhttp|node-fetch|axios) 1;
}
log_format manga '$remote_addr - [$time_local] "$request" $status ua_flag=$manga_bad_ua';

# 会话 Cookie 校验：值等于令牌即已登录
map $cookie_manga_auth $manga_authed { default 0; "<TOKEN>" 1; }

# 统一未登录响应：除登录相关路径外，未登录一律 302 登录页，避免按路径泄露资源存在
map "$manga_authed:$uri" $manga_gate {
    default              1;
    "~^1:"               0;
    "~^0:/login\.html$"  0;
    "~^0:/__login$"      0;
    "~^0:/__logout$"     0;
}

server {
    listen 80;
    server_name _;

    # 站点根目录：index.html / login.html 放在这里
    root /srv/manga;
    index index.html;

    # 未登录统一跳登录页（含 /books/ 与图片；服务器级 rewrite 先于 location，避免图片响应带长缓存）
    if ($manga_gate = 1) { return 302 /login.html; }

    # 脚本/CLI UA 只记日志（ua_flag=1），不拦截
    access_log /var/log/nginx/manga_access.log manga;

    # 登录接口：密码正确下发会话 Cookie，否则 401（前端 login.html 调用）
    location = /__login {
        limit_req zone=manga_login burst=5 nodelay;
        if ($http_x_password = "<PASSWORD>") {
            add_header Set-Cookie "manga_auth=<TOKEN>; Path=/; Max-Age=86400; HttpOnly; SameSite=Lax" always;
            return 204;
        }
        return 401;
    }
    # 退出：清 Cookie 回登录页
    location = /__logout {
        add_header Set-Cookie "manga_auth=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
        return 302 /login.html;
    }
    # 登录页本身必须免登录可访问
    location = /login.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # 登录页是输密码的页面，CSP 必须有（提交走 JS fetch，form-action 'none' 不影响）
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # 入口不缓存，方便更新前端
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # 如需 CSP：本前端用的是内联 <script>/<style>，script-src/style-src 必须带 'unsafe-inline'。

    # 漫画目录接口。前端请求 /books/<系列>/、/books/<系列>/<章节>/ 并解析 JSON。
    # autoindex_format json 是本项目能列出内容的前提，缺失则页面只有外壳。
    location /books/ {
        autoindex on;
        autoindex_format json;
        limit_except GET HEAD { deny all; }
        # 鉴权靠 Cookie：一律 private + Vary，防将来前置反代/CDN 缓存后喂给未鉴权者
        add_header Cache-Control "private" always;
        add_header Vary Cookie always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # 图片长缓存，返回读者走本地缓存省带宽
        location ~* \.(jpe?g|png|webp|gif|avif)$ {
            add_header Cache-Control "private, max-age=2592000" always;
            add_header Vary Cookie always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
        }
    }

    location / { }
}

# 生产环境建议加 TLS（自备证书或 certbot）。注意：Cookie 设了 Secure 时只能走 HTTPS。
#   listen 443 ssl;
#   ssl_certificate     /path/fullchain.pem;
#   ssl_certificate_key /path/privkey.pem;
# 需要的访问控制、限速等按自身情况另加。